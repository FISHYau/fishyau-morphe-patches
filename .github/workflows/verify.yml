name: Verify source

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    # Fork PRs run synthetic/offline tests without package credentials.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out event revision without persisted credentials
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Test local tools without bytecode caches
        run: python3 -I -B -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test and check source file policy
        run: |
          python3 -I -B tools/test_scaffold.py
          python3 -I -B tools/check_scaffold.py
      - name: Run canonical offline Android tooling suites
        run: python3 -I -B .claude/skills/run-android-morphe/test_all.py

  collection:
    needs: offline
    # Optional dependency access is not release approval. No PR event may reach
    # package credentials; packages:read alone does not grant cross-repo access.
    if: >-
      github.repository == 'FISHYau/fishyau-morphe-patches' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.MORPHE_PACKAGES_READ_READY == 'true'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Build Android collection in an external source copy with JDK 21
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_21_X64:-}"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          run=$(mktemp -d "$RUNNER_TEMP/morphe-collection-XXXXXXXX")
          mkdir "$run/source" "$run/gradle" "$run/results" "$run/tmp" "$run/home"
          export GRADLE_USER_HOME="$run/gradle" TMPDIR="$run/tmp" HOME="$run/home"
          unset JAVA_TOOL_OPTIONS _JAVA_OPTIONS JDK_JAVA_OPTIONS CLASSPATH KOTLIN_HOME
          tar -C "$GITHUB_WORKSPACE" --exclude=.git --exclude=.gradle --exclude=build --exclude=local.properties -cf "$run/source.tar" .
          tar -C "$run/source" -xf "$run/source.tar"
          cd "$run/source"
          java -version
          gradle() {
            bash ./gradlew --no-daemon --max-workers=4 --no-build-cache --stacktrace \
              -PpublicationRepository=FISHYau/fishyau-morphe-patches -Pversion=0.1.0 "$@"
          }
          gradle --rerun-tasks :patches:test :patches:buildAndroid > "$run/results/build.log" 2>&1
          mapfile -d '' bundles < <(find "$run/source" -type f -path '*/build/*' -name '*.mpp' -print0)
          test "${#bundles[@]}" -eq 1
          bundle="${bundles[0]}"
          test -s "$bundle"
          sha256sum "$bundle" > "$run/results/final-mpp.sha256"
          # Catalog generation reads this exact existing MPP, without rebuilding it.
          gradle :patches:generatePatchesList "-PcatalogBundle=$bundle" \
            "-PcatalogOutput=$run/results/patches-list.json" > "$run/results/catalog.log" 2>&1
          sha256sum --check "$run/results/final-mpp.sha256"
          python3 -I -B - "$run" <<'PY'
          import json
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          run = Path(sys.argv[1])
          reports = sorted((run / 'source/patches/build/test-results/test').glob('*.xml'))
          if not reports:
              raise SystemExit('No collection JUnit XML was produced')
          counts = dict(tests=0, failures=0, errors=0, skipped=0)
          for report in reports:
              root = ET.parse(report).getroot()
              if root.tag != 'testsuite':
                  raise SystemExit('Unexpected JUnit root')
              for key in counts:
                  counts[key] += int(root.attrib.get(key, '0'))
          if counts['tests'] <= counts['skipped'] or counts['failures'] or counts['errors']:
              raise SystemExit('Collection tests did not execute successfully')
          catalog = json.loads((run / 'results/patches-list.json').read_text())
          if catalog.get('version') != '0.1.0' or not catalog.get('patches'):
              raise SystemExit('Missing catalog entries or mismatched version')
          print(json.dumps(counts))
          PY
      # No upload, release, channel manifest or publishing credential.
